name: 💡 功能建议 / Feature request
description: 希望 Emulsion 增加、改动或删掉某个能力 / Suggest a capability, change or removal
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        判断要不要做，看的是**场景**，不是方案本身。请把「你在做什么的时候卡住了」写清楚。
        We judge requests by the **scenario**, not the proposed solution — so describe what you were trying to do.

        > 使用方式的疑问请用「使用咨询」模板。
        > For "how do I…" questions, use the **使用咨询 / Usage question** template.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Before you submit
      options:
        - label: 已在 Issues 里搜索过同类建议 / I searched existing issues
          required: true
        - label: 已确认现有版本没有这个能力 / Confirmed the current version lacks it
          required: true

  - type: textarea
    id: scenario
    attributes:
      label: 你在做什么的时候卡住了 / The workflow you got stuck in
      description: 具体到场景、素材量和目标 / Be concrete about the scenario, volume and goal
      placeholder: |
        拍完一场婚礼回来有 2000 多张 RAW，我要先按机位分三组再逐组挑片。
        现在只能在资源库里手动框选，选中之后没法保持这个分组。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作 / How you would like it to work
      description: 越具体越好，草图可以直接拖进来 / Sketches are welcome
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 现在怎么绕过 / Current workaround
      description: 现有做法为什么不够用 / Why the existing way falls short
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能 / Area
      options:
        - 本地资源库 / Local library
        - 上传与存储源 / Upload and storage (S3, WebDAV, cloud)
        - 图文创作 / Articles and writing
        - Zine 制作与导出 / Zine and export
        - AI 助手与 AI 生图 / AI assistant and generation
        - 插件与插件市场 / Plugins and marketplace
        - 浏览器扩展 / Browser extension
        - 设置、外观与快捷键 / Settings, appearance, shortcuts
        - 性能与稳定性 / Performance and stability
        - 其他 / Other
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 影响程度 / Impact
      options:
        - 阻断工作流，只能用别的软件 / Blocks the workflow
        - 明显拖慢效率 / Slows things down noticeably
        - 体验上的小摩擦 / Minor friction
        - 锦上添花 / Nice to have
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他补充 / Anything else
      description: 参考产品、同类做法、资料链接 / References and links
    validations:
      required: false
