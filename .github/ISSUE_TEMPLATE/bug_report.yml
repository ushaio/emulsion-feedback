name: 🐞 问题反馈 / Bug report
description: 崩溃、报错、功能异常 / Crashes, errors and broken behaviour
title: "[Bug] "
labels: ["bug", "待确认"]
body:
  - type: markdown
    attributes:
      value: |
        一条 issue 只讲一件事。带 **\*** 的是必填。
        One issue per report. Fields marked **\*** are required.

        > 安装、升级、启动失败请用「安装与升级」模板；功能建议请用「功能建议」模板。
        > Use **安装与升级 / Install & update** for installation problems, and **功能建议 / Feature request** for ideas.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Before you submit
      options:
        - label: 已在 Issues 里搜索过，没有重复 / I searched existing issues first
          required: true
        - label: 已更新到最新版后仍能复现 / Still reproduces on the latest version
          required: true
        - label: 已看过 README 的「几种常见情况」/ I checked the common cases in the README
          required: true

  - type: input
    id: version
    attributes:
      label: 版本号 / Version
      description: 设置 → 关于 / Settings → About
      placeholder: v0.9.3
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 系统与架构 / OS and architecture
      options:
        - Windows（x64）
        - Windows（ARM 设备，运行 x64 版 / ARM device running the x64 build）
        - macOS（Apple Silicon / arm64）
        - macOS（Intel / x86-64）
        - Linux（x64）
        - Linux（ARM64）
        - 不确定 / Not sure
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断摘要 / Diagnostics
      description: 设置 → 关于 →「复制诊断摘要」，原样粘贴 / Settings → About → copy diagnostics, paste as-is
      render: text
      placeholder: |
        Emulsion Desktop v0.9.3 (Production)
        OS: Windows (x64)
        Timestamp: 2026-11-14T09:57:45.000Z
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / What happened
      description: 一句话说清现象，细节留给下面的步骤 / One or two sentences
      placeholder: 切换相册后，右侧信息栏的照片数显示为 0。/ The photo count shows 0 after switching albums.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 按顺序编号；不能稳定复现的话说明频率 / Number the steps; note the frequency if it is intermittent
      placeholder: |
        1. 打开本地资源库，选中相册 A
        2. 切到相册 B，再切回 A
        3. 右侧信息栏显示 0 张
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected result
      placeholder: 切回相册 A 时继续显示 12 张。/ Still shows 12 photos when switching back.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
      description: 有报错文案就照抄原文 / Copy error text verbatim
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率 / Frequency
      options:
        - 每次都能复现 / Always
        - 经常出现 / Often
        - 偶尔出现 / Sometimes
        - 只出现过一次 / Once
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 截图 / 录屏 / 日志 · Screenshots and logs
      description: |
        文件可以直接拖进这个输入框。日志默认关闭，需要先在 设置 → 日志 打开「启用日志」，再复现一次，然后附上 `logs.json`（路径见 README）。
        Drag files into this box. Logging is off by default — enable it in Settings → Logs, reproduce once, then attach `logs.json` (paths in the README).
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他补充 / Anything else
      description: 最近装过插件、改过存储源、换过网络或代理？这类背景经常是定位问题的关键。/ Recent plugins, storage changes, proxy or network switches — these often matter.
    validations:
      required: false
